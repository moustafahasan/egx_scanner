# EGX Whale Hunter — بوت التنبيهات (V11.5)
# cron بتوقيت UTC؛ البوت نفسه بيقرر حسب توقيت القاهرة.
# الرسوم الافتراضية من فاتورة ثاندر (0.175% + 3 ج لكل أمر) — موجودة في egx_core.py
name: EGX Alerts Bot
on:
  schedule:
    - cron: "*/10 6-14 * * 0-4"   # الأحد..الخميس
  workflow_dispatch: {}
concurrency:
  group: egx-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run bot (stdlib only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bg_alerts.py
